version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/urithivault?sslmode=disable
      - JWT_SECRET=change-this-in-production-to-something-very-secure-32-chars
      - CRON_SECRET=cron-secret-bypass-for-vercel-cron-triggers
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=urithivault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urithivault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
